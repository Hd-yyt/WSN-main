[file]
traffic = ./data/Temp/temp.npz
meta = ./data/Temp/temp_meta.csv
adj = ./data/Temp/adj_geo.npy
model = ./outputs/temp/model.pt
log = ./outputs/temp/train.log
result = ./outputs/temp/result.json
artifact = ./outputs/temp/diagnostics.npz
dataset_name = temp

[data]
input_len = 48
output_len = 24
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2

[train]
cuda = 0
max_epoch = 20
batch_size = 8
learning_rate = 0.002
weight_decay = 0.0001
seed = 1
grad_clip = 0.0
val_interval = 2
early_stop_patience = 5
amp = true
allow_tf32 = true
deterministic = false
num_workers = 0

[param]
factors = 32
layers = 4
tps = 24
tpn = 2
recur = 11
sps = 2
spn = 2048
nodes = 3850
id = 64
nd = 32
ablation_mode = full
position_encoder = geoclip
use_elevation = true
elevation_encoder = discrete
branch_mode = full
fusion_mode = learned

