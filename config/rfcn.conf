[file]
traffic = ./data/RainfallCN/rainfall_flow.npz
meta = ./data/RainfallCN/cn_data.csv
adj = ./data/RainfallCN/output_file.npy
model = ./outputs/rfcn/model.pt
log = ./outputs/rfcn/train.log
result = ./outputs/rfcn/result.json
artifact = ./outputs/rfcn/diagnostics.npz
dataset_name = rfcn

[data]
input_len = 30
output_len = 30
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2
is_precipitation = true
rain_thresholds = 0.1,1,5,10
rain_quantiles = 0.90,0.95,0.99

[train]
cuda = 0
max_epoch = 5
batch_size = 16
learning_rate = 0.002
weight_decay = 0.0001
seed = 2

[param]
factors = 32
layers = 5
tps = 15
tpn = 2
recur = 10
sps = 2
spn = 1024
nodes = 1800
id = 64
nd = 32
ablation_mode = full
position_encoder = geoclip
use_elevation = true
elevation_encoder = discrete
branch_mode = full
fusion_mode = learned

