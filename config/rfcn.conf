[file]
traffic = ./data/RainfallCN/rainfall_flow.npz
meta = ./data/RainfallCN/cn_data.csv
adj = ./data/RainfallCN/output_file.npy
model = ./cpt/rf_model
log = ./log/rfcn_log

[data]
input_len = 30
output_len = 30
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2

[train]
cuda = 0
max_epoch = 5
batch_size = 16
learning_rate = 0.002
weight_decay = 0.0001
seed = 1

[param]
factors = 32
layers = 5
tps = 15
tpn = 2
recur = 10
sps = 2
spn = 1024
nodes = 1800
tod = 31
dow = 12
id = 64
nd = 32
td = 32
dd = 32