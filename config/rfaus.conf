[file]
traffic = ./data/RainfallAUS/Rainfall_AUS.npz
meta = ./data/RainfallAUS/aus_data.csv
adj = ./data/RainfallAUS/adj_Rainfall_AUS.npy
model = ./outputs/rfaus/model.pt
log = ./outputs/rfaus/train.log
result = ./outputs/rfaus/result.json
artifact = ./outputs/rfaus/diagnostics.npz
dataset_name = rfaus

[data]
input_len = 30
output_len = 30
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2
is_precipitation = true
rain_thresholds = 0.1,1,5,10
rain_quantiles = 0.90,0.95,0.99

[train]
cuda = 0
max_epoch = 10
batch_size = 32
learning_rate = 0.002
weight_decay = 0.0001
seed = 1

[param]
factors = 32
layers = 5
tps = 15
tpn = 2
recur = 10
sps = 2
spn = 1024
nodes = 1230
id = 64
nd = 32
ablation_mode = full
position_encoder = geoclip
use_elevation = true
elevation_encoder = discrete
branch_mode = full
fusion_mode = learned

