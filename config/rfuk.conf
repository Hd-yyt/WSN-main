[file]
traffic = ./data/RainfallUK/Rainfall_UK.npz
meta = ./data/RainfallUK/uk_data.csv
adj = ./data/RainfallUK/adj_Rainfall_UK.npy
model = ./cpt/rfSA_model
log = ./log/rfuk_log

[data]
input_len = 30
output_len = 30
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2

[train]
cuda = 0
max_epoch = 5
batch_size = 16
learning_rate = 0.002
weight_decay = 0.0001
seed = 1

[param]
factors = 32
layers = 5
tps = 15
tpn = 2
recur = 6
sps = 2
spn = 64
nodes = 100
tod = 31
dow = 12
id = 64
nd = 32
