adj = ./data/MeteoNet/meteonet_se_adj.npy
model = ./outputs/meteonet_se/model.pt
log = ./outputs/meteonet_se/train.log
dataset_name = meteonet_se
result = ./outputs/meteonet_se/result.json
artifact = ./outputs/meteonet_se/diagnostics.npz

[data]
